name: DCC Continuous Control

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: dcc-control-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    outputs:
      active: ${{ steps.inspect.outputs.active }}
      generation: ${{ steps.inspect.outputs.generation }}
      milestone: ${{ steps.inspect.outputs.milestone }}
      checkpoint_status: ${{ steps.inspect.outputs.checkpoint_status }}
      session_id: ${{ steps.inspect.outputs.session_id }}
      pr_number: ${{ steps.inspect.outputs.pr_number }}
      head_sha: ${{ steps.inspect.outputs.head_sha }}
      expected_base_branch: ${{ steps.inspect.outputs.expected_base_branch }}
      expected_base_sha: ${{ steps.inspect.outputs.expected_base_sha }}
      ci_success: ${{ steps.inspect.outputs.ci_success }}
      need_ci: ${{ steps.inspect.outputs.need_ci }}
    steps:
      - name: Checkout controller state
        uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: .dcc/control-state.json
          sparse-checkout-cone-mode: false

      - name: Inspect active checkpoint and PR
        id: inspect
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number || '' }}
        shell: bash
        run: |
          set -euo pipefail

          state=.dcc/control-state.json
          jq -e . "$state" >/dev/null
          generation=$(jq -r '.generation' "$state")
          milestone=$(jq -r '.milestone' "$state")
          checkpoint_status=$(jq -r '.status' "$state")
          session_id=$(jq -r '.jules_session_id' "$state")
          pr_number=$(jq -r '.pr_number' "$state")
          expected_base_branch=$(jq -r '.expected_base_branch' "$state")
          expected_base_sha=$(jq -r '.expected_base_sha' "$state")

          test "$generation" != null && test -n "$generation"
          test -n "$milestone" && test "$milestone" != null
          test -n "$session_id" && test "$session_id" != null
          test -n "$pr_number" && test "$pr_number" != null

          active=true
          if [[ "$EVENT_NAME" == 'pull_request_target' && "$EVENT_PR_NUMBER" != "$pr_number" ]]; then
            active=false
          fi

          {
            echo "active=$active"
            echo "generation=$generation"
            echo "milestone=$milestone"
            echo "checkpoint_status=$checkpoint_status"
            echo "session_id=$session_id"
            echo "pr_number=$pr_number"
            echo "expected_base_branch=$expected_base_branch"
            echo "expected_base_sha=$expected_base_sha"
          } >> "$GITHUB_OUTPUT"

          if [[ "$active" != true ]]; then
            echo 'Event is not for the active DCC PR; no action.'
            echo 'head_sha=' >> "$GITHUB_OUTPUT"
            echo 'ci_success=false' >> "$GITHUB_OUTPUT"
            echo 'need_ci=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}" > /tmp/pr.json
          test "$(jq -r '.state' /tmp/pr.json)" = 'open' || {
            echo 'Active checkpoint PR is not open.'
            echo 'active=false' >> "$GITHUB_OUTPUT"
            echo 'head_sha=' >> "$GITHUB_OUTPUT"
            echo 'ci_success=false' >> "$GITHUB_OUTPUT"
            echo 'need_ci=false' >> "$GITHUB_OUTPUT"
            exit 0
          }

          head_sha=$(jq -r '.head.sha' /tmp/pr.json)
          head_repo=$(jq -r '.head.repo.full_name' /tmp/pr.json)
          pr_user=$(jq -r '.user.login' /tmp/pr.json)
          base_ref=$(jq -r '.base.ref' /tmp/pr.json)
          base_sha=$(jq -r '.base.sha' /tmp/pr.json)

          test "$head_repo" = "$GITHUB_REPOSITORY" || { echo 'Refusing owner secrets for fork PR'; exit 1; }
          test "$pr_user" = 'huzely' || { echo 'Refusing owner secrets for non-owner PR'; exit 1; }
          test "$base_ref" = "$expected_base_branch" || { echo "Unexpected PR base: $base_ref"; exit 1; }
          test "$base_sha" = "$expected_base_sha" || { echo "Authoritative base moved: expected $expected_base_sha, got $base_sha"; exit 1; }
          test -n "$head_sha" && test "$head_sha" != 'null'

          gh api -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/commits/${head_sha}/check-runs?per_page=100" > /tmp/checks.json

          ci_success=$(jq -r '[.check_runs[] | select(.name == "exact-head-ci" and .conclusion == "success")] | length > 0' /tmp/checks.json)
          need_ci=false
          if [[ "$EVENT_NAME" == 'pull_request_target' || "$ci_success" != true ]]; then
            need_ci=true
          fi

          {
            echo "head_sha=$head_sha"
            echo "ci_success=$ci_success"
            echo "need_ci=$need_ci"
          } >> "$GITHUB_OUTPUT"

          echo "Checkpoint generation $generation: $milestone / Jules $session_id / PR #$pr_number / head $head_sha"
          echo "Existing exact-head CI success: $ci_success"

  exact-head-ci:
    name: exact-head-ci
    needs: inspect
    if: ${{ needs.inspect.outputs.active == 'true' && needs.inspect.outputs.need_ci == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact active PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.inspect.outputs.head_sha }}
          fetch-depth: 0

      - name: Verify checkpoint generation and exact active head
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.inspect.outputs.pr_number }}
          TARGET_SHA: ${{ needs.inspect.outputs.head_sha }}
          EXPECTED_GENERATION: ${{ needs.inspect.outputs.generation }}
        shell: bash
        run: |
          set -euo pipefail
          current=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')
          test "$current" = "$TARGET_SHA" || { echo "PR head moved from $TARGET_SHA to $current; refusing stale CI."; exit 1; }
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"

          gh api "repos/${GITHUB_REPOSITORY}/contents/.dcc/control-state.json?ref=main" --jq '.content' | tr -d '\n' | base64 -d > /tmp/current-state.json
          current_generation=$(jq -r '.generation' /tmp/current-state.json)
          test "$current_generation" = "$EXPECTED_GENERATION" || { echo "Checkpoint generation moved from $EXPECTED_GENERATION to $current_generation; refusing stale CI."; exit 1; }

      - name: Verify authoritative base ancestry
        env:
          EXPECTED_BASE_SHA: ${{ needs.inspect.outputs.expected_base_sha }}
          TARGET_SHA: ${{ needs.inspect.outputs.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${EXPECTED_BASE_SHA}^{commit}"
          git merge-base --is-ancestor "$EXPECTED_BASE_SHA" "$TARGET_SHA" || {
            echo "Active head $TARGET_SHA is not descended from authoritative base $EXPECTED_BASE_SHA"; exit 1;
          }

      - name: Verify M2.2 migration boundary
        if: ${{ needs.inspect.outputs.milestone == 'M2.2' }}
        shell: bash
        run: |
          set -euo pipefail
          test -f server/v2/migrations/002_v2_account_identity_schema.sql
          test -f server/v2/migrations/003_v2_provider_identity_schema.sql || {
            echo 'M2.2 requires migration 003_v2_provider_identity_schema.sql'; exit 1;
          }
          if grep -Eq 'CREATE[[:space:]]+TABLE[^;]*v2_provider_identities' server/v2/migrations/002_v2_account_identity_schema.sql; then
            echo 'Migration 002 must remain account-only; provider identities belong in migration 003.'
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/v2/package-lock.json

      - name: Install locked dependencies
        working-directory: server/v2
        run: npm ci

      - name: Run unit and static tests
        working-directory: server/v2
        run: npm run test:unit

      - name: Require TEST database secret
        env:
          POSTGRES_TEST_URL: ${{ secrets.POSTGRES_TEST_URL }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$POSTGRES_TEST_URL" || { echo 'POSTGRES_TEST_URL secret is missing'; exit 1; }

      - name: Run PostgreSQL integration on TEST database
        working-directory: server/v2
        env:
          POSTGRES_TEST_URL: ${{ secrets.POSTGRES_TEST_URL }}
          POSTGRES_IS_TEST_STAGING: 'true'
        run: npm run test:integration

      - name: Repeat integration on same persistent TEST database
        working-directory: server/v2
        env:
          POSTGRES_TEST_URL: ${{ secrets.POSTGRES_TEST_URL }}
          POSTGRES_IS_TEST_STAGING: 'true'
        run: npm run test:integration

  ci-failure-feedback:
    needs: [inspect, exact-head-ci]
    if: ${{ always() && needs.inspect.outputs.active == 'true' && needs.exact-head-ci.result == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Send one fresh exact-head CI failure to same Jules session
        env:
          GH_TOKEN: ${{ github.token }}
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          GENERATION: ${{ needs.inspect.outputs.generation }}
          MILESTONE: ${{ needs.inspect.outputs.milestone }}
          PR_NUMBER: ${{ needs.inspect.outputs.pr_number }}
          SESSION_ID: ${{ needs.inspect.outputs.session_id }}
          TARGET_SHA: ${{ needs.inspect.outputs.head_sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$JULES_API_KEY" || { echo 'JULES_API_KEY secret is missing'; exit 1; }

          gh api "repos/${GITHUB_REPOSITORY}/contents/.dcc/control-state.json?ref=main" --jq '.content' | tr -d '\n' | base64 -d > /tmp/state.json
          current_generation=$(jq -r '.generation' /tmp/state.json)
          [[ "$current_generation" == "$GENERATION" ]] || { echo 'Stale generation; suppressing feedback.'; exit 0; }

          current=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')
          if [[ "$current" != "$TARGET_SHA" ]]; then
            echo "Head already moved to $current; suppressing stale CI feedback for $TARGET_SHA."
            exit 0
          fi

          curl --fail-with-body --silent --show-error \
            -H "x-goog-api-key: $JULES_API_KEY" \
            "https://jules.googleapis.com/v1alpha/sessions/$SESSION_ID" \
            -o /tmp/session.json
          state=$(jq -r '.state' /tmp/session.json)
          if [[ "$state" == 'IN_PROGRESS' ]]; then
            echo 'Jules is already IN_PROGRESS; do not interrupt.'
            exit 0
          fi

          key="g${GENERATION}:${MILESTONE}:pr${PR_NUMBER}:${TARGET_SHA}:ci-failure"
          curl --fail-with-body --silent --show-error \
            -H "x-goog-api-key: $JULES_API_KEY" \
            "https://jules.googleapis.com/v1alpha/sessions/$SESSION_ID/activities?pageSize=100" \
            -o /tmp/activities.json
          if jq -e --arg key "$key" '.. | strings | select(contains($key))' /tmp/activities.json >/dev/null; then
            echo "Feedback key already present: $key"
            exit 0
          fi

          message="DCC_COMMAND_KEY=${key}. Independent exact-head CI failed for PR #${PR_NUMBER} at ${TARGET_SHA}. Inspect ${RUN_URL}, correct the failure in THIS SAME Jules session and update the existing PR. Do not create another session or PR. Use TEST database only; never production."
          jq -n --arg prompt "$message" '{prompt:$prompt}' > /tmp/body.json
          curl --fail-with-body --silent --show-error \
            -X POST -H 'Content-Type: application/json' \
            -H "x-goog-api-key: $JULES_API_KEY" \
            --data-binary @/tmp/body.json \
            "https://jules.googleapis.com/v1alpha/sessions/$SESSION_ID:sendMessage"

  jules-watch:
    needs: [inspect, exact-head-ci]
    if: ${{ always() && needs.inspect.outputs.active == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    steps:
      - name: Resume same Jules session only once when work is still blocked
        env:
          GH_TOKEN: ${{ github.token }}
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          GENERATION: ${{ needs.inspect.outputs.generation }}
          MILESTONE: ${{ needs.inspect.outputs.milestone }}
          PR_NUMBER: ${{ needs.inspect.outputs.pr_number }}
          SESSION_ID: ${{ needs.inspect.outputs.session_id }}
          EXPECTED_BASE_SHA: ${{ needs.inspect.outputs.expected_base_sha }}
          PREVIOUS_CI_SUCCESS: ${{ needs.inspect.outputs.ci_success }}
          CI_JOB_RESULT: ${{ needs.exact-head-ci.result }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$JULES_API_KEY" || { echo 'JULES_API_KEY secret is missing'; exit 1; }

          gh api "repos/${GITHUB_REPOSITORY}/contents/.dcc/control-state.json?ref=main" --jq '.content' | tr -d '\n' | base64 -d > /tmp/state.json
          current_generation=$(jq -r '.generation' /tmp/state.json)
          [[ "$current_generation" == "$GENERATION" ]] || { echo 'Stale generation; suppressing resume.'; exit 0; }

          curl --fail-with-body --silent --show-error \
            -H "x-goog-api-key: $JULES_API_KEY" \
            "https://jules.googleapis.com/v1alpha/sessions/$SESSION_ID" \
            -o /tmp/session.json
          session_state=$(jq -r '.state' /tmp/session.json)
          echo "Jules state: $session_state"

          if [[ "$session_state" == 'IN_PROGRESS' ]]; then
            echo 'Jules is working; no intervention.'
            exit 0
          fi

          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > /tmp/pr.json
          pr_state=$(jq -r '.state' /tmp/pr.json)
          mergeable=$(jq -r 'if .mergeable == null then "unknown" else (.mergeable|tostring) end' /tmp/pr.json)
          head_sha=$(jq -r '.head.sha' /tmp/pr.json)

          if [[ "$pr_state" != 'open' ]]; then
            echo 'Active PR is no longer open; leave milestone transition to ChatGPT/Work semantic controllers.'
            exit 0
          fi

          ci_good=false
          if [[ "$CI_JOB_RESULT" == 'success' || "$PREVIOUS_CI_SUCCESS" == 'true' ]]; then
            ci_good=true
          fi

          if [[ "$session_state" == 'COMPLETED' && ( "$mergeable" == 'false' || "$ci_good" != 'true' ) ]]; then
            key="g${GENERATION}:${MILESTONE}:pr${PR_NUMBER}:${head_sha}:resume-blocked"
            curl --fail-with-body --silent --show-error \
              -H "x-goog-api-key: $JULES_API_KEY" \
              "https://jules.googleapis.com/v1alpha/sessions/$SESSION_ID/activities?pageSize=100" \
              -o /tmp/activities.json
            if jq -e --arg key "$key" '.. | strings | select(contains($key))' /tmp/activities.json >/dev/null; then
              echo "Resume key already present: $key"
              exit 0
            fi

            message="DCC_COMMAND_KEY=${key}. Resume THIS SAME session for the current milestone. PR #${PR_NUMBER} at ${head_sha} is still not independently acceptable (mergeable=${mergeable}, exact-head-ci-good=${ci_good}). Continue from the latest correction/control message already in this session, reconcile against authoritative base ${EXPECTED_BASE_SHA}, fix the existing PR, and push a corrected head. Do not create a new Jules session or PR. Do not use production or production DB."
            jq -n --arg prompt "$message" '{prompt:$prompt}' > /tmp/body.json
            curl --fail-with-body --silent --show-error \
              -X POST -H 'Content-Type: application/json' \
              -H "x-goog-api-key: $JULES_API_KEY" \
              --data-binary @/tmp/body.json \
              "https://jules.googleapis.com/v1alpha/sessions/$SESSION_ID:sendMessage"
            echo 'Resumed blocked Jules session.'
          else
            echo 'No mechanical Jules intervention needed; semantic PASS/milestone transition remains controller-gated.'
          fi
