name: DCC Jules Command Bridge

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  command:
    if: >-
      github.event.issue.pull_request &&
      github.event.comment.user.login == 'huzely' &&
      startsWith(github.event.comment.body, '/dcc-jules ')
    runs-on: ubuntu-latest
    steps:
      - name: Parse and validate command
        id: cmd
        env:
          BODY: ${{ github.event.comment.body }}
        shell: bash
        run: |
          set -euo pipefail
          payload="${BODY#'/dcc-jules '}"
          printf '%s' "$payload" | jq -e . >/dev/null
          action=$(printf '%s' "$payload" | jq -r '.action // empty')
          session_id=$(printf '%s' "$payload" | jq -r '.session_id // empty')
          case "$action" in
            status|approve-plan|send-message|create-session|verify-ci) ;;
            *) echo "Unsupported action: $action"; exit 1 ;;
          esac
          if [[ "$action" == 'status' || "$action" == 'approve-plan' || "$action" == 'send-message' ]]; then
            test -n "$session_id" || { echo 'session_id is required'; exit 1; }
          fi
          {
            echo "action=$action"
            echo "session_id=$session_id"
          } >> "$GITHUB_OUTPUT"

      - name: Validate Jules secret
        if: ${{ steps.cmd.outputs.action == 'status' || steps.cmd.outputs.action == 'approve-plan' || steps.cmd.outputs.action == 'send-message' || steps.cmd.outputs.action == 'create-session' }}
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$JULES_API_KEY" || { echo 'JULES_API_KEY secret is missing'; exit 1; }

      - name: Get Jules session
        if: ${{ steps.cmd.outputs.action == 'status' || steps.cmd.outputs.action == 'approve-plan' || steps.cmd.outputs.action == 'send-message' }}
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          SESSION_ID: ${{ steps.cmd.outputs.session_id }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -H "x-goog-api-key: $JULES_API_KEY" \
            "https://jules.googleapis.com/v1alpha/sessions/$SESSION_ID" \
            -o /tmp/session.json
          jq '{id,title,state,url,outputs}' /tmp/session.json

      - name: List Jules activities
        if: ${{ steps.cmd.outputs.action == 'status' }}
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          SESSION_ID: ${{ steps.cmd.outputs.session_id }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -H "x-goog-api-key: $JULES_API_KEY" \
            "https://jules.googleapis.com/v1alpha/sessions/$SESSION_ID/activities?pageSize=100" \
            | jq '.activities[-30:]'

      - name: Approve Jules plan
        if: ${{ steps.cmd.outputs.action == 'approve-plan' }}
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          SESSION_ID: ${{ steps.cmd.outputs.session_id }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST -H 'Content-Type: application/json' \
            -H "x-goog-api-key: $JULES_API_KEY" -d '{}' \
            "https://jules.googleapis.com/v1alpha/sessions/$SESSION_ID:approvePlan"

      - name: Send message to Jules
        if: ${{ steps.cmd.outputs.action == 'send-message' }}
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          SESSION_ID: ${{ steps.cmd.outputs.session_id }}
          BODY: ${{ github.event.comment.body }}
        shell: bash
        run: |
          set -euo pipefail
          payload="${BODY#'/dcc-jules '}"
          message=$(printf '%s' "$payload" | jq -r '.message // empty')
          test -n "$message" || { echo 'message is required'; exit 1; }
          jq -n --arg prompt "$message" '{prompt:$prompt}' >/tmp/body.json
          curl --fail-with-body --silent --show-error \
            -X POST -H 'Content-Type: application/json' \
            -H "x-goog-api-key: $JULES_API_KEY" \
            --data-binary @/tmp/body.json \
            "https://jules.googleapis.com/v1alpha/sessions/$SESSION_ID:sendMessage"

      - name: Create Jules session
        if: ${{ steps.cmd.outputs.action == 'create-session' }}
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          BODY: ${{ github.event.comment.body }}
        shell: bash
        run: |
          set -euo pipefail
          payload="${BODY#'/dcc-jules '}"
          title=$(printf '%s' "$payload" | jq -r '.title // empty')
          branch=$(printf '%s' "$payload" | jq -r '.starting_branch // empty')
          message=$(printf '%s' "$payload" | jq -r '.message // empty')
          test -n "$title" && test -n "$branch" && test -n "$message" || { echo 'title, starting_branch and message are required'; exit 1; }
          jq -n --arg title "$title" --arg branch "$branch" --arg prompt "$message" \
            '{prompt:$prompt,title:$title,sourceContext:{source:"sources/github/huzely/dam-cuoi-chuot",githubRepoContext:{startingBranch:$branch}},requirePlanApproval:true,automationMode:"AUTO_CREATE_PR"}' >/tmp/create.json
          code=$(curl --silent --show-error -o /tmp/result.json -w '%{http_code}' \
            -X POST -H 'Content-Type: application/json' \
            -H "x-goog-api-key: $JULES_API_KEY" --data-binary @/tmp/create.json \
            'https://jules.googleapis.com/v1alpha/sessions')
          if [[ "$code" == '429' ]]; then
            echo 'JULES_QUOTA_OR_RATE_LIMITED'; cat /tmp/result.json; exit 75
          fi
          [[ "$code" -ge 200 && "$code" -lt 300 ]] || { cat /tmp/result.json; exit 1; }
          jq '{id,title,state,url}' /tmp/result.json

      - name: Resolve and validate exact PR head
        if: ${{ steps.cmd.outputs.action == 'verify-ci' }}
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > /tmp/pr.json
          head_sha=$(jq -r '.head.sha' /tmp/pr.json)
          head_repo=$(jq -r '.head.repo.full_name' /tmp/pr.json)
          pr_user=$(jq -r '.user.login' /tmp/pr.json)
          test "$head_repo" = "$GITHUB_REPOSITORY" || { echo 'Refusing CI secrets for fork PR'; exit 1; }
          test "$pr_user" = 'huzely' || { echo 'Refusing CI secrets for non-owner PR'; exit 1; }
          test -n "$head_sha" && test "$head_sha" != 'null'
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "Independent verification target: $head_sha"

      - name: Checkout exact PR head
        if: ${{ steps.cmd.outputs.action == 'verify-ci' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head_sha }}

      - name: Set up Node.js for independent CI
        if: ${{ steps.cmd.outputs.action == 'verify-ci' }}
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/v2/package-lock.json

      - name: Install locked dependencies
        if: ${{ steps.cmd.outputs.action == 'verify-ci' }}
        working-directory: server/v2
        run: npm ci

      - name: Run unit and static tests
        if: ${{ steps.cmd.outputs.action == 'verify-ci' }}
        working-directory: server/v2
        run: npm run test:unit

      - name: Require TEST database secret
        if: ${{ steps.cmd.outputs.action == 'verify-ci' }}
        env:
          POSTGRES_TEST_URL: ${{ secrets.POSTGRES_TEST_URL }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$POSTGRES_TEST_URL" || { echo 'POSTGRES_TEST_URL secret is missing'; exit 1; }

      - name: Run PostgreSQL integration and migration 002 verification
        if: ${{ steps.cmd.outputs.action == 'verify-ci' }}
        working-directory: server/v2
        env:
          POSTGRES_TEST_URL: ${{ secrets.POSTGRES_TEST_URL }}
          POSTGRES_IS_TEST_STAGING: 'true'
        run: npm run test:integration

      - name: Repeat integration on same persistent TEST database
        if: ${{ steps.cmd.outputs.action == 'verify-ci' }}
        working-directory: server/v2
        env:
          POSTGRES_TEST_URL: ${{ secrets.POSTGRES_TEST_URL }}
          POSTGRES_IS_TEST_STAGING: 'true'
        run: npm run test:integration
