name: DCC Mechanical Verification

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: dcc-mechanical-verification-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  resolve-target:
    runs-on: ubuntu-latest
    outputs:
      active: ${{ steps.resolve.outputs.active }}
      generation: ${{ steps.resolve.outputs.generation }}
      milestone: ${{ steps.resolve.outputs.milestone }}
      session_id: ${{ steps.resolve.outputs.session_id }}
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      head_sha: ${{ steps.resolve.outputs.head_sha }}
      expected_base_sha: ${{ steps.resolve.outputs.expected_base_sha }}
    steps:
      - name: Checkout authoritative checkpoint
        uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: .dcc/control-state.json
          sparse-checkout-cone-mode: false

      - name: Resolve exact implementation candidate without changing controller state
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR: ${{ github.event.pull_request.number || '' }}
        shell: bash
        run: |
          set -euo pipefail
          state=.dcc/control-state.json
          jq -e . "$state" >/dev/null

          generation=$(jq -r '.generation' "$state")
          milestone=$(jq -r '.milestone' "$state")
          status=$(jq -r '.status' "$state")
          session_id=$(jq -r '.jules_session_id // empty' "$state")
          implementation_pr=$(jq -r '.implementation_pr_number // empty' "$state")
          expected_base_branch=$(jq -r '.expected_base_branch // .starting_branch // empty' "$state")
          expected_base_sha=$(jq -r '.expected_base_sha // .expected_start_sha // empty' "$state")

          active=false
          pr_number=''
          head_sha=''

          # ChatGPT is the semantic controller. Audit/hold states are intentionally inert here.
          case "$status" in
            AUDIT_REQUIRED|WAITING_PLAN_APPROVAL|PLANNING|WAITING_FOR_JULES_QUOTA|READY_FOR_PLAYTEST)
              echo "Controller state $status: no implementation CI target."
              ;;
            *)
              if [[ "$EVENT_NAME" == pull_request_target ]]; then
                pr_number="$EVENT_PR"
              elif [[ -n "$implementation_pr" && "$implementation_pr" != null ]]; then
                pr_number="$implementation_pr"
              fi

              if [[ -n "$pr_number" ]]; then
                gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}" > /tmp/pr.json
                pr_state=$(jq -r '.state' /tmp/pr.json)
                head_repo=$(jq -r '.head.repo.full_name' /tmp/pr.json)
                pr_user=$(jq -r '.user.login' /tmp/pr.json)
                base_ref=$(jq -r '.base.ref' /tmp/pr.json)
                base_sha=$(jq -r '.base.sha' /tmp/pr.json)
                head_ref=$(jq -r '.head.ref' /tmp/pr.json)
                body=$(jq -r '.body // ""' /tmp/pr.json)
                head_sha=$(jq -r '.head.sha' /tmp/pr.json)

                identity_match=false
                if [[ -n "$session_id" && ( "$head_ref" == *"$session_id"* || "$body" == *"$session_id"* ) ]]; then
                  identity_match=true
                fi

                if [[ "$pr_state" == open && "$head_repo" == "$GITHUB_REPOSITORY" && "$pr_user" == huzely && \
                      "$base_ref" == "$expected_base_branch" && "$base_sha" == "$expected_base_sha" && \
                      "$identity_match" == true ]]; then
                  if [[ -z "$implementation_pr" || "$implementation_pr" == null || "$implementation_pr" == "$pr_number" ]]; then
                    active=true
                  fi
                fi
              fi
              ;;
          esac

          {
            echo "active=$active"
            echo "generation=$generation"
            echo "milestone=$milestone"
            echo "session_id=$session_id"
            echo "pr_number=$pr_number"
            echo "head_sha=$head_sha"
            echo "expected_base_sha=$expected_base_sha"
          } >> "$GITHUB_OUTPUT"

          echo "DCC mechanical target: active=$active generation=$generation milestone=$milestone pr=${pr_number:-none} head=${head_sha:-none}"

  exact-head-ci:
    name: exact-head-ci
    needs: resolve-target
    if: ${{ needs.resolve-target.outputs.active == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact Jules branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-target.outputs.head_sha }}
          fetch-depth: 0

      - name: Verify exact head and authoritative ancestry
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.resolve-target.outputs.pr_number }}
          TARGET_SHA: ${{ needs.resolve-target.outputs.head_sha }}
          EXPECTED_BASE_SHA: ${{ needs.resolve-target.outputs.expected_base_sha }}
        shell: bash
        run: |
          set -euo pipefail
          current=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')
          test "$current" = "$TARGET_SHA" || { echo "PR head moved; neutral stale run."; exit 0; }
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git merge-base --is-ancestor "$EXPECTED_BASE_SHA" "$TARGET_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/v2/package-lock.json

      - name: Install locked dependencies
        working-directory: server/v2
        run: npm ci

      - name: Run unit and static tests
        working-directory: server/v2
        run: npm run test:unit

      - name: Require TEST database secret
        env:
          POSTGRES_TEST_URL: ${{ secrets.POSTGRES_TEST_URL }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$POSTGRES_TEST_URL" || { echo 'POSTGRES_TEST_URL secret is missing'; exit 1; }

      - name: Run PostgreSQL integration on TEST database
        working-directory: server/v2
        env:
          POSTGRES_TEST_URL: ${{ secrets.POSTGRES_TEST_URL }}
          POSTGRES_IS_TEST_STAGING: 'true'
        run: npm run test:integration

      - name: Repeat integration on the same persistent TEST database
        working-directory: server/v2
        env:
          POSTGRES_TEST_URL: ${{ secrets.POSTGRES_TEST_URL }}
          POSTGRES_IS_TEST_STAGING: 'true'
        run: npm run test:integration

      - name: Mechanical result only
        run: |
          echo 'Mechanical CI passed. This workflow MUST NOT approve a Jules plan, message Jules, mark a milestone PASS, or advance the roadmap.'
          echo 'ChatGPT must inspect the branch/diff and frozen DOCX requirements before any semantic decision.'
