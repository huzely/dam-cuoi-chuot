name: DCC Jules Bridge

on:
  workflow_dispatch:
    inputs:
      session_id:
        description: 'Existing Jules session ID'
        required: true
        default: '13026570411885116826'
      action:
        description: 'Bridge action'
        required: true
        type: choice
        options:
          - status
          - approve-plan
          - send-message
        default: status
      message:
        description: 'Message for Jules (send-message only)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - name: Validate secret
        shell: bash
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$JULES_API_KEY" || { echo 'JULES_API_KEY secret is missing'; exit 1; }

      - name: Get Jules session
        id: session
        shell: bash
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          SESSION_ID: ${{ inputs.session_id }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -H "x-goog-api-key: $JULES_API_KEY" \
            "https://jules.googleapis.com/v1alpha/sessions/$SESSION_ID" \
            -o session.json
          python3 - <<'PY'
          import json
          with open('session.json', encoding='utf-8') as f:
              s=json.load(f)
          print('Jules session:', s.get('id'))
          print('Title:', s.get('title'))
          print('State:', s.get('state'))
          print('URL:', s.get('url'))
          PY

      - name: List latest activities
        if: ${{ inputs.action == 'status' }}
        shell: bash
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          SESSION_ID: ${{ inputs.session_id }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -H "x-goog-api-key: $JULES_API_KEY" \
            "https://jules.googleapis.com/v1alpha/sessions/$SESSION_ID/activities?pageSize=100" \
            -o activities.json
          python3 - <<'PY'
          import json
          with open('activities.json', encoding='utf-8') as f:
              data=json.load(f)
          acts=data.get('activities', [])
          for a in acts[-20:]:
              kinds=[k for k in ('planGenerated','planApproved','userMessaged','agentMessaged','progressUpdated','sessionCompleted','sessionFailed') if a.get(k) is not None]
              print(a.get('createTime'), a.get('originator'), ','.join(kinds) or '-', a.get('description',''))
          PY

      - name: Approve Jules plan
        if: ${{ inputs.action == 'approve-plan' }}
        shell: bash
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          SESSION_ID: ${{ inputs.session_id }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H 'Content-Type: application/json' \
            -H "x-goog-api-key: $JULES_API_KEY" \
            -d '{}' \
            "https://jules.googleapis.com/v1alpha/sessions/$SESSION_ID:approvePlan"
          echo 'Plan approval sent.'

      - name: Send message to Jules
        if: ${{ inputs.action == 'send-message' }}
        shell: bash
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          SESSION_ID: ${{ inputs.session_id }}
          MESSAGE: ${{ inputs.message }}
        run: |
          set -euo pipefail
          test -n "$MESSAGE" || { echo 'message is required for send-message'; exit 1; }
          python3 - <<'PY' > body.json
          import json, os
          print(json.dumps({'prompt': os.environ['MESSAGE']}))
          PY
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H 'Content-Type: application/json' \
            -H "x-goog-api-key: $JULES_API_KEY" \
            --data-binary @body.json \
            "https://jules.googleapis.com/v1alpha/sessions/$SESSION_ID:sendMessage"
          echo 'Message sent.'
